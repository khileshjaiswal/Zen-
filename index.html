<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b8bd6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Calculator</title>
<style>
html{--W:min(96vw,520px,calc(96vh*.64));--u:calc(var(--W)/100)}
@supports (height:100dvh){html{--W:min(96vw,520px,calc(96dvh*.64))}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{margin:0;height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;
  background:#e9eef3;font-family:Roboto,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;overscroll-behavior:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.calc{width:var(--W);
  background:linear-gradient(#f9fafb,#e8edf2);border-radius:calc(1.5*var(--u));overflow:hidden;box-shadow:0 calc(2*var(--u)) calc(6*var(--u)) rgba(30,50,80,.25)}
.header{background:#5b8bd6;color:#fff;height:calc(12*var(--u));display:flex;align-items:center;justify-content:space-between;padding:0 calc(4*var(--u));font-size:calc(6*var(--u));font-weight:700}
.win{width:calc(5*var(--u));height:calc(5*var(--u));border:calc(.7*var(--u)) solid #fff;border-radius:calc(1*var(--u))}
.body{padding:calc(2.5*var(--u)) calc(.8*var(--u)) calc(.8*var(--u))}
.screen{position:relative;background:#fff;border:calc(.25*var(--u)) solid #b9c3cf;border-radius:calc(1.2*var(--u));height:calc(24*var(--u));margin:0 0 calc(3*var(--u));padding:0 calc(3*var(--u));
  display:flex;align-items:center;justify-content:flex-end;overflow:hidden}
#val{flex:none;font-size:calc(13*var(--u));color:#111;white-space:nowrap;line-height:1}
.expr{background:#fff;border:calc(.25*var(--u)) solid #b9c3cf;border-radius:calc(1.2*var(--u));height:calc(11*var(--u));margin:0 0 calc(2*var(--u));padding:0 calc(3*var(--u));display:flex;align-items:center;justify-content:flex-end;overflow:hidden;color:#5a6678;font-size:calc(5.5*var(--u))}
#exprT{flex:none;white-space:nowrap}
#mflag{position:absolute;left:calc(2.5*var(--u));top:calc(1.5*var(--u));font-size:calc(3.5*var(--u));font-weight:700;color:#5b8bd6;visibility:hidden}
.keys{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:calc(9.5*var(--u)) calc(17*var(--u)) repeat(4,calc(14.5*var(--u)));gap:calc(1.8*var(--u))}
button{font:inherit;font-size:calc(6.5*var(--u));font-weight:600;color:#333;cursor:pointer;min-width:0;
  background:linear-gradient(#fff,#f3f5f8);border:calc(.25*var(--u)) solid #b9c3cf;border-radius:calc(1*var(--u));
  box-shadow:0 calc(.5*var(--u)) 0 rgba(120,135,155,.35);transition:transform .05s,box-shadow .05s,filter .1s;
  touch-action:manipulation;user-select:none;-webkit-user-select:none}
button:hover{filter:brightness(.97)}
button:active{transform:translateY(calc(.4*var(--u)));box-shadow:0 calc(.1*var(--u)) 0 rgba(120,135,155,.35)}
button:focus-visible{outline:calc(.6*var(--u)) solid #5b8bd6;outline-offset:calc(.2*var(--u))}
.mem{font-size:calc(5.3*var(--u));color:#44546a;background:linear-gradient(#f6f8fb,#e6ebf1)}
.red{background:linear-gradient(#e86a6a,#e25555);color:#fff;border-color:#c64545;font-size:calc(7*var(--u))}
.green{background:linear-gradient(#34d27a,#2ac96f);color:#fff;border-color:#22a85b;font-size:calc(9*var(--u));grid-row:span 2}
.back,.plus{grid-column:span 2}
/* Phones in portrait: fill the whole screen */
@media (max-width:600px) and (orientation:portrait){
  html{--W:100vw}
  .calc{width:100%;height:100%;border-radius:0;box-shadow:none;display:flex;flex-direction:column}
  .header{height:calc(14*var(--u));font-size:calc(6.5*var(--u))}
  .body{flex:1;min-height:0;display:flex;flex-direction:column;padding:calc(2.5*var(--u)) calc(2.5*var(--u)) calc(3*var(--u))}
  .screen{height:calc(26*var(--u))}
  .expr{height:calc(11*var(--u));font-size:calc(6*var(--u))}
  #val{font-size:calc(15*var(--u))}
  .keys{flex:1;min-height:0;gap:calc(2.2*var(--u));grid-template-rows:.6fr 1.1fr repeat(4,1fr)}
  button{font-size:calc(8*var(--u))}
  .mem{font-size:calc(6*var(--u))}
  .red{font-size:calc(8.5*var(--u))}
  .green{font-size:calc(11*var(--u))}
}
</style>
</head>
<body>
<main class="calc" aria-label="Calculator">
  <div class="header"><span>Calculator</span><span class="win" aria-hidden="true"></span></div>
  <div class="body">
    <div class="expr" id="expr" aria-hidden="true"><span id="exprT"></span></div>
    <div class="screen" id="screen" role="status" aria-live="polite"><span id="mflag">M</span><span id="val">0</span></div>
    <div class="keys" id="keys">
      <button class="mem" data-k="MC">MC</button><button class="mem" data-k="MR">MR</button><button class="mem" data-k="MS">MS</button>
      <button class="mem" data-k="M+">M+</button><button class="mem" data-k="M-">M-</button>
      <button class="red back" data-k="back" aria-label="Backspace">&larr;</button>
      <button class="red" data-k="C">C</button><button class="red" data-k="neg">+/-</button>
      <button data-k="sqrt" aria-label="Square root">&radic;</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="/">/</button><button data-k="%">%</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="*">*</button><button data-k="recip">1/x</button>
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="-">-</button>
      <button class="green" data-k="=" aria-label="Equals">=</button>
      <button data-k="0">0</button><button data-k=".">.</button><button class="plus" data-k="+">+</button>
    </div>
  </div>
</main>
<script>
(() => {
'use strict';
const MAXD = 16, P = 16;                       // max typed digits, result significant digits
const valEl = document.getElementById('val'), screenEl = document.getElementById('screen'), mflag = document.getElementById('mflag');

/* ---------- Exact decimal arithmetic (BigInt): value = i / 10^s ---------- */
const p10 = n => 10n ** BigInt(n), ABS = x => x < 0n ? -x : x, LEN = x => ABS(x).toString().length;
const parse = str => {
  const m = /^([+-]?)(\d*)\.?(\d*)(?:e([+-]?\d+))?$/i.exec(str);
  if (!m || !(m[2] + m[3])) return {i: 0n, s: 0};
  let i = BigInt(m[2] + m[3]), s = m[3].length - (m[4] ? +m[4] : 0);
  if (s < 0) { i *= p10(-s); s = 0; }
  return {i: m[1] === '-' ? -i : i, s};
};
const rnd = (d, p = 32) => {                      // round half-up to p significant digits, strip trailing zeros
  let a = ABS(d.i), s = d.s;
  const len = a.toString().length;
  if (len > p) { const k = len - p; a = (a + 5n * p10(k - 1)) / p10(k); s -= k; }
  if (s < 0) { a *= p10(-s); s = 0; }
  while (s > 0 && a % 10n === 0n) { a /= 10n; s--; }
  return {i: d.i < 0n ? -a : a, s};
};
const toStr = d0 => {                            // display: integers exact (<=32 digits), fractions 16 significant digits
  const r = rnd(d0, 32);
  if (r.i === 0n) return '0';
  const frac = r.s > 0, d = frac ? rnd(r, P) : r;
  const neg = d.i < 0n, ds = ABS(d.i).toString(), e = ds.length - 1 - d.s;
  if (Math.abs(e) > 300) return null;
  let out;
  if (frac ? (e >= 16 || e < -9) : e >= 32) {
    const t = ds.replace(/0+$/, '');
    out = t[0] + (t.length > 1 ? '.' + t.slice(1) : '') + 'e' + (e < 0 ? '-' : '+') + Math.abs(e);
  } else if (d.s === 0) out = ds;
  else if (ds.length > d.s) out = ds.slice(0, ds.length - d.s) + '.' + ds.slice(ds.length - d.s);
  else out = '0.' + '0'.repeat(d.s - ds.length) + ds;
  return (neg ? '-' : '') + out;
};
const calc = (a, o, b) => {
  if (o === '+' || o === '-') {
    const s = Math.max(a.s, b.s), x = a.i * p10(s - a.s), y = b.i * p10(s - b.s);
    return {i: o === '+' ? x + y : x - y, s};
  }
  if (o === '*') return {i: a.i * b.i, s: a.s + b.s};
  if (o === '/') {
    if (b.i === 0n) return null;
    const R = 40 + Math.max(0, LEN(b.i) - LEN(a.i));
    return {i: a.i * p10(b.s + R) / b.i, s: a.s + R};
  }
  return b;
};
const isqrt = n => {
  if (n < 2n) return n;
  let x = 1n << BigInt((n.toString(2).length + 1) >> 1);
  for (;;) { const y = (x + n / x) >> 1n; if (y >= x) return x; x = y; }
};
const sqrtD = d => {
  let i = d.i, s = d.s;
  if (s % 2) { i *= 10n; s++; }
  return {i: isqrt(i * p10(80)), s: s / 2 + 40};
};

/* ---------- State machine (with operator precedence: x and / before + and -) ---------- */
const SYM = {'+': '+', '-': '\u2212', '*': '\u00d7', '/': '\u00f7'};
const S = {cur: '0', exact: null, list: [], label: null, done: null, fresh: false, afterOp: false, eq: false,
           lastOp: null, lastB: null, err: false, mem: {i: 0n, s: 0}, memSet: false};
const num = () => S.exact || parse(S.cur);
const lab = () => S.label || S.cur;
const wrap = (t, first) => (!first && t[0] === '-') ? '(' + t + ')' : t;
const tokens = () => S.list.map((x, i) => typeof x === 'string' ? SYM[x] : wrap(x.label, i === 0));
const exprNow = () => S.done !== null ? S.done
  : tokens().concat(S.label ? [wrap(S.label, S.list.length === 0)] : []).join(' ');
const nums = () => S.list.map(x => typeof x === 'string' ? x : x.n);
const ev = L => {                                // L = [n, op, n, op, n ...]
  const ns = [L[0]], os = [];
  for (let i = 1; i < L.length; i += 2) {
    const o = L[i], n = L[i + 1];
    if (o === '*' || o === '/') {
      const r = calc(ns[ns.length - 1], o, n);
      if (!r) return null;
      ns[ns.length - 1] = rnd(r, 120);
    } else { os.push(o); ns.push(n); }
  }
  let r = ns[0];
  os.forEach((o, k) => { r = rnd(calc(r, o, ns[k + 1]), 120); });
  return r;
};
function setError(ex) {
  Object.assign(S, {cur: 'Error', exact: null, err: true, list: [], label: null, done: ex || '',
                    fresh: true, afterOp: false, eq: false, lastOp: null, lastB: null});
  return false;
}
function commit(r, ex) {                         // show a result; Error on null / out of range
  if (!r) return setError(ex);
  const x = rnd(r), s = toStr(x);
  if (s === null) return setError(ex);
  S.cur = s; S.exact = x; return true;
}
function clearErr() {
  if (S.err) Object.assign(S, {cur: '0', exact: null, err: false, list: [], label: null, done: null,
                               fresh: false, afterOp: false, eq: false});
}
function newNumber() {
  clearErr();
  if (S.fresh) { S.cur = '0'; S.fresh = false; }
  if (S.eq) { S.eq = false; S.lastOp = null; }
  S.exact = null; S.label = null; S.done = null; S.afterOp = false;
}
function digit(d) {
  newNumber();
  if (S.cur === '0') S.cur = d;
  else if (S.cur === '-0') S.cur = '-' + d;
  else if (S.cur.replace(/[-.]/g, '').length < MAXD) S.cur += d;
}
function dot() { newNumber(); if (!S.cur.includes('.')) S.cur += '.'; }
function operator(o) {
  if (S.err) return;
  S.done = null;
  if (S.list.length && S.afterOp) { S.list[S.list.length - 1] = o; return; }   // replace consecutive operator
  S.list.push({n: num(), label: lab()}, o);
  S.label = null; S.fresh = true; S.afterOp = true; S.eq = false;
}
function equals() {
  if (S.err) return;
  let L, ex, op, b;
  if (S.list.length) {
    b = num(); op = S.list[S.list.length - 1];
    ex = tokens().concat([wrap(lab(), false)]).join(' ') + ' =';
    L = nums().concat([b]);
  } else if (S.eq && S.lastOp) {                 // repeat last operation
    b = S.lastB; op = S.lastOp;
    ex = [wrap(lab(), true), SYM[op], wrap(toStr(b) || '0', false), '='].join(' ');
    L = [num(), op, b];
  } else { S.done = lab() + ' ='; S.label = null; S.fresh = true; S.eq = true; return; }
  const r = ev(L);
  S.list = []; S.label = null;
  if (!commit(r, ex)) return;
  S.lastOp = op; S.lastB = b; S.done = ex; S.fresh = true; S.eq = true; S.afterOp = false;
}
function back() {
  if (S.err) return clearErr();
  if (S.fresh) return;
  S.cur = S.cur.slice(0, -1);
  if (S.cur === '' || S.cur === '-' || S.cur === '-0') S.cur = '0';
}
function negate() {
  if (S.err) return;
  if (num().i === 0n && !S.cur.includes('.')) return;
  if (S.exact) S.exact = {i: -S.exact.i, s: S.exact.s};
  S.cur = S.cur.startsWith('-') ? S.cur.slice(1) : '-' + S.cur;
  if (S.label) S.label = 'negate(' + S.label + ')';
  S.afterOp = false; S.done = null;
}
function unary(fn, mk) {                         // sqrt, 1/x
  if (S.err) return;
  const l = mk(lab()), r = fn(num());
  S.done = null;
  if (!commit(r, tokens().concat([wrap(l, S.list.length === 0)]).join(' '))) return;
  S.label = l; S.fresh = true; S.afterOp = false;
}
const sqrt = () => unary(n => n.i < 0n ? null : sqrtD(n), t => '\u221a(' + t + ')');
const recip = () => unary(n => calc({i: 1n, s: 0}, '/', n), t => '1/(' + t + ')');
function percent() {
  if (S.err) return;
  const n = num(), last = S.list[S.list.length - 1];
  let r;
  if (S.list.length && (last === '+' || last === '-')) {   // 200 + 10 % -> 200 + 20 (10% of the running total)
    const base = ev(nums().slice(0, -1));
    if (!base) return void setError('');
    r = {i: base.i * n.i, s: base.s + n.s + 2};
  } else r = {i: n.i, s: n.s + 2};                         // 200 x 10 % -> 200 x 0.1 ; 50 % -> 0.5
  S.done = null;
  if (commit(r, '')) { S.label = null; S.fresh = true; S.afterOp = false; }
}
function memory(k) {
  if (k === 'MC') { S.mem = {i: 0n, s: 0}; S.memSet = false; return; }
  if (k === 'MR') {
    if (!S.memSet) return;
    clearErr();
    if (commit(S.mem, '')) { S.label = null; S.done = null; S.fresh = true; S.afterOp = false; }
    return;
  }
  if (S.err) return;
  const n = num();
  S.mem = k === 'MS' ? rnd(n) : rnd(calc(S.mem, k === 'M+' ? '+' : '-', n));
  S.memSet = true; S.fresh = true;
}
function hardReset() {
  Object.assign(S, {cur: '0', exact: null, list: [], label: null, done: null, fresh: false, afterOp: false,
                    eq: false, lastOp: null, lastB: null, err: false, mem: {i: 0n, s: 0}, memSet: false});
}
function press(k) {
  if (/^[0-9]$/.test(k)) digit(k);
  else switch (k) {
    case '.': dot(); break;
    case '+': case '-': case '*': case '/': operator(k); break;
    case '=': equals(); break;
    case 'back': back(); break;
    case 'C': hardReset(); break;
    case 'neg': negate(); break;
    case 'sqrt': sqrt(); break;
    case 'recip': recip(); break;
    case '%': percent(); break;
    default: memory(k);
  }
  render();
}

/* ---------- Rendering ---------- */
const exprEl = document.getElementById('expr'), exprT = document.getElementById('exprT');
let lastExpr = '';
const availW = el => { const cs = getComputedStyle(el); return el.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight); };
function fit() {
  valEl.style.fontSize = '';
  const avail = availW(screenEl);
  let fs = parseFloat(getComputedStyle(valEl).fontSize);
  while (valEl.offsetWidth > avail && fs > 8) { fs--; valEl.style.fontSize = fs + 'px'; }
}
function fitExpr() {                             // shrink, then drop the oldest characters if still too long
  let s = lastExpr;
  exprT.textContent = s; exprT.style.fontSize = '';
  const avail = availW(exprEl);
  let fs = parseFloat(getComputedStyle(exprT).fontSize);
  const min = Math.max(9, fs * .65);
  while (exprT.offsetWidth > avail && fs > min) { fs--; exprT.style.fontSize = fs + 'px'; }
  while (exprT.offsetWidth > avail && s.length > 1) { s = s.slice(1); exprT.textContent = '\u2026' + s; }
}
const refit = () => { fit(); fitExpr(); };
function render() {
  valEl.textContent = S.cur;
  lastExpr = exprNow();
  mflag.style.visibility = S.memSet ? 'visible' : 'hidden';
  refit();
}
document.getElementById('keys').addEventListener('click', e => {
  const b = e.target.closest('button[data-k]');
  if (b) press(b.dataset.k);
});
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (/^[0-9]$/.test(k) || '+-*/%'.includes(k) && k.length === 1) press(k);
  else if (k === '.' || k === ',') press('.');
  else if (k === 'Enter' || k === '=') press('=');
  else if (k === 'Backspace') press('back');
  else if (k === 'Escape' || k === 'Delete') press('C');
  else return;
  e.preventDefault();
});
if ('ResizeObserver' in window) new ResizeObserver(refit).observe(screenEl); else window.addEventListener('resize', refit);
window.__calc = {press, S, exprNow};
render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
